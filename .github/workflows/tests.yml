name: tests

# The repo believed it had a pre-commit guard (scripts/check_status_size.sh
# claims ".git/hooks/pre-commit already delegates here"), but git hooks are
# never cloned — `find .git/hooks -type f -not -name '*.sample'` returns 0 on a
# fresh checkout. So nothing mechanically enforced the 600-test suite. This does.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24,<3" "torch>=2.0,<3"

      - name: Run test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_*.py" -t tests

      - name: Smoke the continual harness (all arms + all declared controls)
        run: PYTHONPATH=src python experiments/86_betb_compositional.py --tiny --out /tmp/e86.json

      - name: Reports index is current
        run: python scripts/build_reports_index.py --check

      - name: STATUS.md stays a bookmark
        run: bash scripts/check_status_size.sh
